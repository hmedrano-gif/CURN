const b64pc=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrirProtegida(clave){let html;try{const c=CONTENIDO_CIF;
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64pc(c.s),iterations:c.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64pc(c.v)},k,b64pc(c.d)));}catch(e){return false;}
  try{sessionStorage.setItem('claveNotasTPD',clave);}catch(e){}
  const tmp=document.createElement('div');tmp.innerHTML=html;const scripts=[...tmp.querySelectorAll('script')].map(s=>{const t=s.textContent;s.remove();return t;});
  document.body.innerHTML='';while(tmp.firstChild)document.body.appendChild(tmp.firstChild);
  for(const t of scripts){const s=document.createElement('script');s.textContent=t;document.body.appendChild(s);}
  document.dispatchEvent(new Event('DOMContentLoaded'));return true;}
document.getElementById('formClave').onsubmit=async e=>{e.preventDefault();
  if(!(await abrirProtegida(document.getElementById('clave').value)))document.getElementById('avisoClave').textContent='Clave incorrecta. Intenta de nuevo.';};
(async()=>{let c=null;try{c=sessionStorage.getItem('claveNotasTPD');}catch(e){}if(c)await abrirProtegida(c);})();
</script></body></html>
