<style>
:root{--navy:#1B2A4A;--blue:#2F6DB5;--amber:#9A5B00;--green:#2E7D4F;--red:#B3261E;--bg:#F3F2F1;--line:#C9CED8;--muted:#605E5C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#252423;font:16px/1.55 "Segoe UI",Calibri,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:22px 16px}header h1{margin:4px 0;font-family:Cambria,Georgia,serif;font-size:clamp(24px,4vw,34px)}
.wrap{max-width:1000px;margin:0 auto}main{padding:16px}

.paso{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;break-inside:avoid-page}
.paso h3{margin:0 0 6px;font-size:17px;color:var(--navy)}
.cmd{display:flex;gap:8px;align-items:flex-start;margin:6px 0}

button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:8px 12px;cursor:pointer;white-space:nowrap}
button.ok{background:var(--green)}
.sal{color:#1d4d2e;background:#E5F2EA;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:15px}
.pq{color:#1B2A4A;background:#E6EDF7;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:15px}
.falla{color:#7a2a00;background:#FBEBD0;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:15px}
.nota{color:var(--muted);font-size:14px;margin:4px 0}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}table.t th{background:var(--navy);color:#fff;text-align:left}
table.t td,table.t th{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
figure{margin:10px 0}figure img{max-width:100%;border:1px solid var(--line);border-radius:6px}figcaption{color:var(--muted);font-size:13px}
select{font:inherit;padding:4px 8px;border-radius:6px}a{color:var(--blue)}
@media print{button,select{display:none}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}.paso{break-inside:auto}figure{break-inside:avoid}}

const b64pc=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrirProtegida(clave){let html;try{const c=CONTENIDO_CIF;
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64pc(c.s),iterations:c.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64pc(c.v)},k,b64pc(c.d)));}catch(e){return false;}
  try{sessionStorage.setItem('claveNotasTPD',clave);}catch(e){}
  const tmp=document.createElement('div');tmp.innerHTML=html;const scripts=[...tmp.querySelectorAll('script')].map(s=>{const t=s.textContent;s.remove();return t;});
  document.body.innerHTML='';while(tmp.firstChild)document.body.appendChild(tmp.firstChild);
  for(const t of scripts){const s=document.createElement('script');s.textContent=t;document.body.appendChild(s);}
  document.dispatchEvent(new Event('DOMContentLoaded'));return true;}
document.getElementById('formClave').onsubmit=async e=>{e.preventDefault();
  if(!(await abrirProtegida(document.getElementById('clave').value)))document.getElementById('avisoClave').textContent='Clave incorrecta. Intenta de nuevo.';};
(async()=>{let c=null;try{c=sessionStorage.getItem('claveNotasTPD');}catch(e){}if(c)await abrirProtegida(c);})();
</script></body></html>
