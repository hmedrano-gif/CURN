<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesión 4 · Del dato a la decisión</title>
<meta name="robots" content="noindex">
<style>
:root{
  --navy:#1B2A4A;--blue:#2F6DB5;--blue-soft:#DCE6F4;--amber:#9A5B00;--amber-soft:#FBEBD0;
  --red:#A33A2C;--red-soft:#F6DEDA;--green:#2E7D4F;--green-soft:#DDEFE3;
  --bg:#F3F2F1;--card:#FFFFFF;--line:#C9CED8;--text:#252423;--muted:#605E5C;
  --serif:Cambria,"Iowan Old Style",Georgia,serif;--sans:"Segoe UI",Calibri,system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
button{font:inherit;cursor:pointer}
/* ---------- marco ---------- */
.top{position:fixed;inset:0 0 auto 0;height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--navy);color:#fff;z-index:20}
.top .marca{font-size:13px;letter-spacing:.06em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top button{white-space:nowrap;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
.top button:hover{background:rgba(255,255,255,.12)}
.progreso{position:fixed;top:48px;left:0;height:4px;background:var(--blue);z-index:20;transition:width .3s}
.escena{position:fixed;top:52px;bottom:56px;left:0;right:0;overflow:auto;padding:24px 16px}
.slide{display:none;max-width:1180px;margin:0 auto;animation:entra .35s ease}
.slide.on{display:block}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pie{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:16px;background:#fff;border-top:1px solid var(--line);z-index:20}
.pie button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 18px;font-weight:600;color:var(--navy)}
.pie button:hover{background:var(--blue-soft)}
.pie .num{font-size:14px;color:var(--muted);min-width:70px;text-align:center}
/* índice */
.indice{position:fixed;top:52px;right:0;bottom:56px;width:min(360px,100%);background:#fff;border-left:1px solid var(--line);z-index:30;overflow:auto;transform:translateX(105%);transition:transform .25s}
.indice.on{transform:none}
.indice h3{margin:16px 16px 8px;font-family:var(--serif);color:var(--navy)}
.indice a{display:block;padding:9px 16px;color:var(--text);text-decoration:none;border-left:4px solid transparent;font-size:14px}
.indice a:hover{background:var(--bg)}
.indice a.on{border-left-color:var(--blue);background:var(--blue-soft);font-weight:600}
.indice .grupo{padding:10px 16px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* ---------- tipografía ---------- */
h1,h2{font-family:var(--serif);color:var(--navy);margin:0}
h2{font-size:clamp(24px,3vw,34px)}
.sub{color:var(--muted);font-style:italic;margin:6px 0 18px;font-size:15px}
p{line-height:1.5;margin:.4em 0}
.banda{background:var(--navy);color:#fff;border-radius:10px;padding:14px 18px;font-weight:600;margin-top:18px;line-height:1.45}
.banda.amb{background:var(--amber-soft);color:var(--amber)}
.nota{font-size:13px;color:var(--muted);font-style:italic}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:820px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cab{border-radius:10px 10px 0 0;color:#fff;padding:10px 14px;font-weight:700}
.cuerpo{border-radius:0 0 10px 10px;padding:12px 14px}
.navy{background:var(--navy)}.blue{background:var(--blue)}.amber{background:var(--amber)}.red{background:var(--red)}.green{background:var(--green)}
.s-blue{background:var(--blue-soft)}.s-amber{background:var(--amber-soft)}.s-red{background:var(--red-soft)}.s-green{background:var(--green-soft)}
ul.p{padding-left:20px;margin:6px 0}ul.p li{margin:6px 0;line-height:1.45}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--navy);font-weight:600;margin:3px}
.boton{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600}
.boton.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.boton:disabled{opacity:.45;cursor:default}
.botones{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
/* portadas */
.portada{background:var(--navy);color:#fff;border-radius:14px;padding:clamp(28px,6vw,64px);min-height:62vh;display:flex;flex-direction:column;justify-content:center}
.portada h1{color:#fff;font-size:clamp(30px,4.6vw,52px);line-height:1.15}
.portada .u{letter-spacing:.18em;font-size:13px;opacity:.75;margin-bottom:6px}
.portada .pre{font-size:clamp(18px,2vw,22px);margin-top:26px;border-left:4px solid #8FB3E6;padding-left:16px;font-style:italic;opacity:.95}
.portada .bl{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.portada .bl span{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 16px;font-size:14px;opacity:.7}
.portada .bl span.on{background:#fff;color:var(--navy);opacity:1;font-weight:700}
/* KPI */
.kpi{text-align:center}.kpi b{display:block;white-space:nowrap;font-family:var(--serif);font-size:clamp(22px,2.6vw,32px);color:var(--navy)}.kpi span{color:var(--muted);font-size:13px}
/* cadena */
.carril{display:grid;grid-template-columns:130px 1fr;border-radius:10px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}
.carril .rot{background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:14px}
.carril .fila{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#fff}
@media(max-width:820px){.carril{grid-template-columns:1fr}}
.nodo{border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);min-width:150px;flex:1;text-align:left}
.nodo b{color:var(--navy);display:block}.nodo small{color:var(--muted)}
.nodo .t{float:right;font-size:11px;background:var(--amber);color:#fff;border-radius:999px;padding:1px 8px}
.nodo:hover,.nodo.on{border-color:var(--blue);background:var(--blue-soft)}
.detalle{background:#fff;border-left:5px solid var(--blue);border-radius:8px;padding:12px 16px;min-height:58px;margin-top:6px}
/* cadena de herramientas */
.paso{border:0;text-align:left;border-radius:10px;padding:0;background:transparent}
.paso .h{min-height:62px;border-radius:10px 10px 0 0;color:#fff;padding:10px 12px;font-weight:700}.paso .h small{display:block;font-weight:400;opacity:.9}
.paso .c{border-radius:0 0 10px 10px;padding:10px 12px;min-height:76px;font-size:14px}
.paso .f{margin-top:8px}
.paso.on{outline:3px solid var(--navy);outline-offset:2px;border-radius:10px}
/* barras */
.barra{height:26px;border-radius:6px;background:var(--blue);transition:width .4s;color:#fff;font-size:12px;display:flex;align-items:center;padding-left:8px;white-space:nowrap}
.pista{background:#ECEBEA;border-radius:6px;position:relative}
.limite{position:absolute;top:-6px;bottom:-6px;border-left:3px dashed var(--red)}
input[type=range]{width:100%}
/* nodos de clúster */
.maq{border:2px solid var(--navy);border-radius:10px;padding:8px;text-align:center;background:#fff;min-width:96px}
.maq.caida{border-style:dashed;border-color:var(--red);background:var(--red-soft);opacity:.75}
.bloque{display:inline-block;border-radius:6px;padding:3px 9px;margin:3px;color:#fff;font-weight:700;font-size:13px}
.b1{background:var(--blue)}.b2{background:var(--navy)}.b3{background:var(--amber)}
.bloque.gris{background:#BDBDBD}
/* papeles de MapReduce */
.papel{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:3px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:all .4s}
.papel.uber{border-left:5px solid var(--navy)}.papel.lyft{border-left:5px solid var(--amber)}
.zona{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:10px;min-height:70px}
.zona h4{margin:0 0 6px;color:var(--navy);font-size:14px}
.cont{display:inline-block;border-radius:6px;padding:6px 8px;margin:3px;font-size:12px;font-weight:600}
table.t{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px}
table.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
.gana{background:var(--green-soft);color:var(--green);font-weight:600;border-radius:8px;padding:10px;text-align:center}
.paga{background:var(--red-soft);color:var(--red);font-weight:600;border-radius:8px;padding:10px;text-align:center}
.dec{background:var(--navy);color:#fff;font-weight:700;border-radius:8px;padding:10px;text-align:center}
.flecha{text-align:center;color:var(--muted);font-size:22px;line-height:1}
.resp{border-radius:8px;padding:12px 14px;margin-top:8px;font-weight:600;display:none}
.resp.on{display:block}
@media(max-width:600px){.tira{display:none}.trade{gap:4px}.trade>*{font-size:12px;padding:6px}}
/* qué sí, qué no y por qué */
.regla{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-bottom:8px}
.regla>div{border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.4}
.regla .si{background:var(--green-soft);border-left:5px solid var(--green)}
.regla .no{background:var(--red-soft);border-left:5px solid var(--red)}
.regla .pq{background:#fff;border:1px solid var(--line)}
.regla.cabeza>div{background:none;border:0;padding:0 12px;font-weight:700}
@media(max-width:820px){.regla{grid-template-columns:1fr;gap:4px;margin-bottom:14px}.regla.cabeza{display:none}
  .regla .si::before{content:"Sí: ";font-weight:700;color:var(--green)}.regla .no::before{content:"No: ";font-weight:700;color:var(--red)}
  .regla .pq::before{content:"Por qué: ";font-weight:700;color:var(--navy)}}
/* ---------- recorrido animado de un viaje ---------- */
.viaje{display:grid;grid-template-columns:230px 1fr;gap:14px}
@media(max-width:820px){.viaje{grid-template-columns:1fr}}
.etapas{display:flex;flex-direction:column;gap:6px}
@media(max-width:820px){.etapas{flex-direction:row;overflow-x:auto}.etapa{flex:0 0 auto}}
.etapa{font:inherit;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;color:var(--muted);position:relative;overflow:hidden;white-space:nowrap}
.etapa b{color:var(--navy);margin-right:6px}
.etapa.hecha{color:var(--text)}.etapa.hecha b{color:var(--green)}
.etapa.on{border-color:var(--blue);color:var(--navy);font-weight:600;background:var(--blue-soft)}
.etapa .avance{position:absolute;left:0;bottom:0;height:3px;background:var(--blue);width:0}
.escenario{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.escenario svg{display:block;width:100%;height:auto}
.leyenda{padding:10px 14px;border-top:1px solid var(--line);min-height:62px}
.leyenda b{color:var(--navy)}
.controles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.controles .vel{margin-left:auto;font-size:13px;color:var(--muted)}
#sViaje .calle{stroke:#E4E2DF;stroke-width:14;stroke-linecap:round;fill:none}
#sViaje .caja{fill:#fff;stroke:var(--line);stroke-width:1.5;transition:stroke .3s,fill .3s}
#sViaje .caja.activa{stroke:var(--blue);stroke-width:3;fill:var(--blue-soft)}
#sViaje svg text{font-family:var(--sans)}
#sViaje .tt{font-size:13px;font-weight:700;fill:var(--navy)}
#sViaje .tx{font-size:11px;fill:var(--muted)}
#sViaje .pant{transition:opacity .35s}
#sViaje .evento{fill:var(--amber)}
#sViaje .brillo{fill:none;stroke:var(--amber);stroke-width:3}
@media (prefers-reduced-motion:reduce){.slide{animation:none}#sViaje .pant,#sViaje .caja{transition:none}}
/*BIB*/
.fuente{margin-top:14px;font-size:13px;color:var(--muted)}
.fuente a,.bib a{color:var(--blue)}
.bib h4{margin:14px 0 4px;color:var(--navy);font-size:15px}
.bib p{margin:4px 0;padding-left:1.6em;text-indent:-1.6em;font-size:14px;line-height:1.45}
/*FIN BIB*/
.portada{position:relative}

/* ---------- Sesión 2: más contenido por diapositiva, sin desplazarse en un proyector de 1366 × 768 ---------- */
.escena{padding-top:14px}
.sub{margin:4px 0 10px}
.grid{gap:10px}
.card{padding:9px 13px}
.card p{margin:.25em 0;line-height:1.4}
.banda{margin-top:10px;padding:9px 16px}
ul.p li{margin:3px 0}
.fuente{margin-top:8px}
table.t td,table.t th{padding:5px 8px}
/* ---------- Sesión 2: simulación del día ---------- */
.ventana{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#1e1e1e}
.vbarra{display:flex;align-items:center;gap:6px;background:#2d2d2d;color:#ccc;padding:6px 10px;font-size:12px;flex-wrap:wrap}
.vbarra .pt{width:10px;height:10px;border-radius:50%;background:#555}
.vbarra .vtit{margin-left:6px}.vbarra .sp{flex:1}
.vbarra .reloj{background:var(--amber);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700}
.vbarra .guia{background:#3a3d41;border-radius:999px;padding:1px 10px}
.term{height:270px;overflow:auto;padding:10px 12px;color:#d4d4d4;font:12.5px/1.45 Consolas,"Cascadia Mono","Courier New",monospace;white-space:pre-wrap;word-break:break-all}
.term .pr{color:#4ec9b0}.term .cm{color:#fff}.term .ok{color:#6a9955}.term .res{color:#b5e48c;font-weight:700}
.term .nv{color:#dcdcaa;font-style:italic}.term .ap{color:#9cdcfe}.term .wt{color:#ce9178}
.term .bar{display:inline-block;width:140px;height:8px;background:#3a3d41;border-radius:4px;vertical-align:middle;margin-left:8px;overflow:hidden}
.term .bar i{display:block;height:100%;background:#ce9178}
.term .cur{background:#d4d4d4;color:#1e1e1e}
@media(max-width:820px){.term{height:300px;font-size:11.5px}.flujoK{grid-template-columns:1fr!important}.flujoK .flecha{transform:rotate(90deg)}}
.tabla{border-collapse:collapse;width:100%;font-size:14px}.tabla th{background:var(--navy);color:#fff;text-align:left}.tabla td,.tabla th{border:1px solid #C9CED8;padding:5px 8px}.cod{background:#1e1e1e;color:#fff;border-radius:6px;padding:6px 8px;font:12px/1.4 Consolas,monospace;white-space:pre-wrap;margin:6px 0}@media(max-width:820px){.docente{font-size:12px}.marca{font-size:12px}}</style>

const b64pc=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrirProtegida(clave){let html;try{const c=CONTENIDO_CIF;
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64pc(c.s),iterations:c.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64pc(c.v)},k,b64pc(c.d)));}catch(e){return false;}
  try{sessionStorage.setItem('claveNotasTPD',clave);}catch(e){}
  const tmp=document.createElement('div');tmp.innerHTML=html;const scripts=[...tmp.querySelectorAll('script')].map(s=>{const t=s.textContent;s.remove();return t;});
  document.body.innerHTML='';while(tmp.firstChild)document.body.appendChild(tmp.firstChild);
  for(const t of scripts){const s=document.createElement('script');s.textContent=t;document.body.appendChild(s);}
  document.dispatchEvent(new Event('DOMContentLoaded'));return true;}
document.getElementById('formClave').onsubmit=async e=>{e.preventDefault();
  if(!(await abrirProtegida(document.getElementById('clave').value)))document.getElementById('avisoClave').textContent='Clave incorrecta. Intenta de nuevo.';};
(async()=>{let c=null;try{c=sessionStorage.getItem('claveNotasTPD');}catch(e){}if(c)await abrirProtegida(c);})();
