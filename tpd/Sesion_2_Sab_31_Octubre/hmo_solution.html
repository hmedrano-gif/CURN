const b64n=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrirProtegida(clave){try{const c=CONTENIDO_CIF;
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64n(c.s),iterations:c.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  document.getElementById('protegida').innerHTML=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64n(c.v)},k,b64n(c.d)));
  try{sessionStorage.setItem('claveNotasTPD',clave);}catch(e){}return true;}catch(e){return false;}}
document.getElementById('formClave').onsubmit=async e=>{e.preventDefault();
  if(!(await abrirProtegida(document.getElementById('clave').value)))document.getElementById('avisoClave').textContent='Clave incorrecta. Intenta de nuevo.';};
(async()=>{let c=null;try{c=sessionStorage.getItem('claveNotasTPD');}catch(e){}if(c)await abrirProtegida(c);})();
</script><script>function copiar(b){const t=b.previousElementSibling.textContent;const fin=()=>{b.textContent='Copiado ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='Copiar';b.classList.remove('ok');},1500);};
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(fin);}else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();fin();}}</script></body></html>
